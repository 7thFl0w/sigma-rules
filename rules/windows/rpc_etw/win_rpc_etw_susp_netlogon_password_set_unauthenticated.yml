title: Potential Zerologon Netlogon Password Set Without RPC Authentication
id: 8c1e7f34-d2b9-4a56-9e03-f7a5b1c68d42
status: test
description: Detects Microsoft-Windows-RPC ETW server call events for the Netlogon interface with a machine account password set procedure (NetrServerPasswordSet or NetrServerPasswordSet2) received without RPC-level authentication, which is consistent with the CVE-2020-1472 Zerologon exploitation flow where the password is reset over an unsecured Netlogon channel.
references:
    - https://www.secura.com/blog/zero-logon
    - https://github.com/SecuraBV/CVE-2020-1472
    - https://attack.mitre.org/techniques/T1210/
author: 7thFl0w
date: 2026-11-11
tags:
    - attack.lateral-movement
    - attack.t1210
    - d3fend.d3-nta
logsource:
    product: windows
    service: rpc_etw
detection:
    selection:
        Provider_Name: 'Microsoft-Windows-RPC'
        EventID: 6
        InterfaceUuid: '12345678-1234-abcd-ef00-01234567cffb'
        ProcNum:
            - 6
            - 30
        AuthenticationLevel: 1
        AuthenticationService: 0
    condition: selection
falsepositives:
    - Unknown
level: medium