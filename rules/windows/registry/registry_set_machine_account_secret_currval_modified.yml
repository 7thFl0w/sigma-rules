title: Machine Account LSA Secret CurrVal Modified
id: 5b2e7d84-1c93-4a6f-8e05-d7f4a1c39b62
status: experimental
description: Detects a registry value write to the default value of the $MACHINE.ACC LSA secret CurrVal key, which indicates the machine account password stored locally was changed and should be correlated with expected Netlogon password rotation or unexpected credential tampering.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/domain-member-maximum-machine-account-password-age
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: 7thFl0w
date: 2026-11-12
tags:
    - attack.persistence
    - attack.t1098
    - d3f:LocalAccountMonitoring
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|endswith: '\Policy\Secrets\$MACHINE.ACC\CurrVal\(Default)'
    condition: selection
falsepositives:
    - Scheduled machine account password rotation performed by the Netlogon service
level: low