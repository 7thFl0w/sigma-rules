title: LSASS Cross-Process Termination Event via ProcessExitMonitor
id: 3a7c9e52-1b4d-4f68-9c0a-5e2d8f6b7a14
status: experimental
description: Detects a Microsoft-Windows-ProcessExitMonitor event 3001 where lsass.exe is the target of a cross-process termination report, which may indicate LSASS credential dumping via the Silent Process Exit technique.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/registry-entries-for-silent-process-exit
    - https://www.deepinstinct.com/blog/lsass-memory-dumps-are-stealthier-than-ever-before-part-2
author: 7thFl0w
date: 2026-11-12
tags:
    - attack.credential-access
    - attack.t1003.001
    - d3f:ProcessAnalysis
    - d3f:OperatingSystemMonitoring
logsource:
    product: windows
    service: application
detection:
    selection:
        Provider_Name: 'Microsoft-Windows-ProcessExitMonitor'
        EventID: 3001
        param1|endswith: '\lsass.exe'
    condition: selection
falsepositives:
    - Unknown
level: high