title: BITS Job With Image File Name As Job Title
id: 142cc5f2-fe20-4d28-92c1-53255e16dca8
status: test
description: Detects a BITS job whose title ends with an image file extension, taken from jobTitle at job creation (EventID 3) or from name in the transfer events (EventID 59, 60, 61), which is unusual for the descriptive job names used by legitimate BITS clients. The two selections are independent so that the rule still works when only one of the fields is exposed by the log parser.
references:
    - https://attack.mitre.org/techniques/T1197/
    - https://learn.microsoft.com/en-us/windows/win32/bits/background-intelligent-transfer-service-portal
author: 7thFl0w
date: 2026-11-02
tags:
    - attack.stealth
    - attack.persistence
    - attack.t1197
    - d3fend.d3-nta
logsource:
    product: windows
    service: bits-client
detection:
    selection_create:
        EventID: 3
        jobTitle|endswith:
            - '.png'
            - '.jpg'
            - '.jpeg'
            - '.gif'
            - '.bmp'
    selection_transfer:
        EventID:
            - 59
            - 60
            - 61
        name|endswith:
            - '.png'
            - '.jpg'
            - '.jpeg'
            - '.gif'
            - '.bmp'
    condition: 1 of selection_*
falsepositives:
    - Applications that name BITS jobs after the image file they download
level: low
