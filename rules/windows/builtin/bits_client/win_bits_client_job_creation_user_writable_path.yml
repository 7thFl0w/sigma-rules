title: BITS Job Created By Process From User-Writable Path
id: 401cfeb9-2071-46a3-b018-6f83d831842b
status: test
description: Hunting rule that detects a BITS job created (EventID 3) by an executable running from a user-writable location such as AppData, ProgramData, Temp, Public or Downloads, where legitimate BITS clients rarely live. The OneDrive standalone updater is excluded and further exclusions should be added after baselining.
references:
    - https://attack.mitre.org/techniques/T1197/
    - https://learn.microsoft.com/en-us/windows/win32/bits/background-intelligent-transfer-service-portal
author: 7thFl0w
date: 2026-11-02
tags:
    - attack.stealth
    - attack.persistence
    - attack.t1197
    - d3fend.d3-psa
logsource:
    product: windows
    service: bits-client
detection:
    selection:
        EventID: 3
        processPath|contains:
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'
            - '\Temp\'
            - '\Downloads\'
    filter_optional_onedrive:
        processPath|contains: '\AppData\Local\Microsoft\OneDrive\'
        processPath|endswith:
            - '\OneDriveStandaloneUpdater.exe'
            - '\OneDriveSetup.exe'
    condition: selection and not 1 of filter_optional_*
falsepositives:
    - Per-user installed applications that use BITS for self-update
level: low
