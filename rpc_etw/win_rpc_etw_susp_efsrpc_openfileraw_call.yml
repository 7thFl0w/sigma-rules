title: Potential PetitPotam EfsRpcOpenFileRaw Call via RPC ETW
id: e7a4b1d2-5c38-4f9a-8d06-2b91c7f3a5e4
status: test
description: Detects Microsoft-Windows-RPC ETW call events for the MS-EFSR interface on the lsarpc or efsrpc pipe with procedure number 0 (EfsRpcOpenFileRaw), the call abused by PetitPotam to coerce a Windows host into authenticating to an arbitrary path.
references:
    - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-efsr/403c7ae0-1a3a-4e96-8efc-54e79a2cc451
    - https://github.com/phackt/PetitPotam
    - https://attack.mitre.org/techniques/T1187/
author: 7thFl0w
date: 2026-11-09
tags:
    - attack.credential-access
    - attack.t1187
    - d3fend.d3-nta
logsource:
    product: windows
    service: rpc_etw
detection:
    selection:
        Provider_Name: 'Microsoft-Windows-RPC'
        EventID:
            - 5
            - 6
        InterfaceUuid:
            - 'c681d488-d850-11d0-8c52-00c04fd90f7e'
            - 'df1941c5-fe89-4e79-bf10-463657acf44d'
        ProcNum: 0
    condition: selection
falsepositives:
    - Legitimate backup software accessing EFS-encrypted files remotely
level: medium