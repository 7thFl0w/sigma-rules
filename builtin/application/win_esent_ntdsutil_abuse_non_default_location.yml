title: NTDS Database Created Outside Default Directory
id: 5d7c2e90-b4a1-4f38-9c6e-81a0d3f7b25c
status: test
description: Detects ESENT event 325 reporting the creation of a database named ntds.dit at a location other than the default Windows NTDS directory, which is consistent with a copy of the Active Directory database created by ntdsutil IFM media creation.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-R2-and-2012/cc732530(v=ws.11)
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-144a
    - https://attack.mitre.org/techniques/T1003/003/
author: 7thFl0w
date: 2026-11-10
tags:
    - attack.credential_access
    - attack.t1003.003
    - d3fend.d3-fa
logsource:
    product: windows
    service: application
detection:
    selection:
        Provider_Name: 'ESENT'
        EventID: 325
        Data|contains: 'ntds.dit'
    filter_main_default_location:
        Data|contains: ', C:\Windows\NTDS\ntds.dit, '
    condition: selection and not filter_main_default_location
falsepositives:
    - Legitimate installation media creation or backup tooling writing ntds.dit to a custom path
level: medium