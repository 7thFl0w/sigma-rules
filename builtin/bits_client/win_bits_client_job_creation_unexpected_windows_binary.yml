title: BITS Job Created By Unexpected Windows Binary
id: 307e3a7d-b6f0-46c5-a7cc-1f86e3e43983
status: test
description: Detects a BITS job created (EventID 3) by a binary in the System32 or SysWOW64 directory other than the known BITS clients svchost.exe and SpeechModelDownload.exe, which suggests a hijacked or injected host process abusing BITS. The exclusion list comes from a single lab host and must be rebuilt from your own baseline.
references:
    - https://attack.mitre.org/techniques/T1197/
    - https://learn.microsoft.com/en-us/windows/win32/bits/background-intelligent-transfer-service-portal
author: 7thFl0w
date: 2026-11-02
tags:
    - attack.stealth
    - attack.persistence
    - attack.t1197
    - d3fend.d3-psa
logsource:
    product: windows
    service: bits-client
detection:
    selection:
        EventID: 3
        processPath|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
    filter_main_svchost:
        processPath: 'C:\Windows\System32\svchost.exe'
    filter_main_speech:
        processPath: 'C:\Windows\System32\Speech_OneCore\common\SpeechModelDownload.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Administrative use of bitsadmin.exe or PowerShell Start-BitsTransfer
level: low
