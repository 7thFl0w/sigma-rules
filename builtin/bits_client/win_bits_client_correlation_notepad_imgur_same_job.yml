title: Notepad BITS Job Correlated With Imgur Transfer On Same Job
id: b4f42bce-10a0-458e-aa70-d82869a71ad1
status: test
description: Correlation rule that fires when the same BITS job is created by notepad.exe (EventID 3, jobId) and transfers from imgur (EventID 59 or 61, Id) within one minute, joined on the job GUID through an alias. It needs a backend with Sigma correlation support and the two base rules loaded together.
references:
    - https://pkg.go.dev/github.com/doracpphp/sigma-go
    - https://attack.mitre.org/techniques/T1197/
    - https://attack.mitre.org/techniques/T1105/
author: 7thFl0w
date: 2026-11-02
tags:
    - attack.defense_evasion
    - attack.persistence
    - attack.t1197
    - attack.command_and_control
    - attack.t1105
    - d3fend.d3-nta
correlation:
    type: temporal
    rules:
        - 4e812267-d033-4316-8edf-02047dcf3772
        - 826135e7-413c-4dcb-a7eb-46215e119821
    group-by:
        - job_guid
    timespan: 1m
    aliases:
        job_guid:
            4e812267-d033-4316-8edf-02047dcf3772: jobId
            826135e7-413c-4dcb-a7eb-46215e119821: Id
falsepositives:
    - Unknown
level: high
---
title: BITS Job Created By Notepad
id: 4e812267-d033-4316-8edf-02047dcf3772
status: test
description: Detects a BITS job created by notepad.exe (EventID 3 of the Bits-Client Operational log). Notepad has no legitimate need to use BITS, so this indicates code running inside or masquerading as a notepad.exe process that pulls remote content.
references:
    - https://attack.mitre.org/techniques/T1197/
    - https://attack.mitre.org/techniques/T1105/
    - https://learn.microsoft.com/en-us/windows/win32/bits/background-intelligent-transfer-service-portal
author: 7thFl0w
date: 2026-11-02
tags:
    - attack.stealth
    - attack.persistence
    - attack.t1197
    - attack.command-and-control
    - attack.t1105
    - d3fend.d3-psa
logsource:
    product: windows
    service: bits-client
detection:
    selection:
        EventID: 3
        processPath|endswith: '\notepad.exe'
    condition: selection
falsepositives:
    - Unknown
level: high
---
title: BITS Transfer Job From Image Hosting Domain
id: 826135e7-413c-4dcb-a7eb-46215e119821
status: test
description: Detects a BITS transfer (EventID 59 started, EventID 61 stopped with error) whose remote URL points to the image hosting service imgur, which is abused to stage payloads behind a reputable domain. EventID 61 is included because a failed name resolution can log only EventID 61.
references:
    - https://attack.mitre.org/techniques/T1197/
    - https://attack.mitre.org/techniques/T1105/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/bits_client/win_bits_client_new_transfer_via_file_sharing_domains.yml
author: 7thFl0w
date: 2026-11-02
tags:
    - attack.stealth
    - attack.persistence
    - attack.t1197
    - attack.command-and-control
    - attack.t1105
    - d3fend.d3-ua
logsource:
    product: windows
    service: bits-client
detection:
    selection:
        EventID:
            - 59
            - 61
        url|contains: '://i.imgur.com/'
    condition: selection
falsepositives:
    - Software that retrieves imgur-hosted images through BITS
level: medium
