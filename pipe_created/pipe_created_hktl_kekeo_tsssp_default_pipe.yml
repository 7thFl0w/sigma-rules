title: HackTool - Kekeo TSSSP Default Named Pipe Created
id: 7e3a5c18-9d42-4b76-a1f0-c8d25e6b3947
status: experimental
description: Detects the creation or connection of the default named pipe used by the Kekeo credential tool TSSSP module, which may indicate execution of Kekeo on the host.
references:
    - https://github.com/gentilkiwi/kekeo
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: 7thFl0w
date: 2026-11-12
tags:
    - attack.credential-access
    - attack.t1003
    - d3f:ProcessAnalysis
logsource:
    product: windows
    category: pipe_created
detection:
    selection:
        PipeName: '\kekeo_tsssp_endpoint'
    condition: selection
falsepositives:
    - Unknown
level: high