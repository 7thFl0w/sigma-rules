title: Built-in Administrator Account Password Attribute Modified in SAM
id: d4a91b3e-6f27-4c58-a0d1-37e5b8c92f46
status: experimental
description: Detects a registry value write to the ForcePasswordReset value of the built-in local Administrator account (RID 500) under the SAM hive, which indicates the account's password was changed or reset and should be validated against approved administration activity.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
author: 7thFl0w
date: 2026-11-12
tags:
    - attack.persistence
    - attack.t1098
    - d3f:LocalAccountMonitoring
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|endswith: '\SAM\Domains\Account\Users\000001F4\ForcePasswordReset'
    condition: selection
falsepositives:
    - Scheduled password rotation of the built-in Administrator account by an approved management tool
level: medium